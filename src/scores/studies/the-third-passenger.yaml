version: "1.0"
id: "the-third-passenger"
title: "The Third Passenger"
subtitle: "Comoving Train Interior, Relative Kinematics & Spatial Twist Study"
description: |
  A single-stage 3D choreography reconstruction of **The Third Passenger** (by Taruma Sakti) built in the **comoving Galilean reference frame** of a speeding interstellar train.

  - **Axis Layout**: Forward (`-Z`) toward the locomotive and Forward Car (`z = -7.5m..0.0m`); Rear (`+Z`) toward the Lounge Car (`z = 0.0m..+8.0m`) and encroaching Erasure Void; Starboard (`+X`) holds the hero Green Armchair, Red Lounge Sofa, and Tea Table; Port (`-X`) holds opposite booths and travel luggage.
  - **Relative Physics**: Shot 1 models the train's cruise velocity via a trackside camera translating at $-\vec{v}_{\text{train}}$ (`easing: "linear"`) past the consist. At `t = 30.80s`, collision deceleration generates a forward/lateral inertial impulse flinging the teapot, teacup, and passengers across the Lounge Car.
  - **The Twist**: After Oscar's sacrifice seals the `z = 0.0m` bulkhead door, the Coordinate Disc activates anyway—revealing an unseen third presence anchored at `third_passenger_mark` (`[0, 0, -5.8]`) in the dark front end of the Forward Car.

metadata:
  director: "Taruma Sakti"
  reference_frame: "Comoving Train Inertial Frame (Z = 0.0m Bulkhead Origin)"
  lens_package:
    wide_master: "24mm / 28mm Full-Frame"
    standard_dialogue: "35mm / 40mm / 50mm"
    telephoto_closeup: "85mm"
  blocking_highlights:
    - "Ruby executes a full 3D inverted chair flop (`pitch: -130`, `pivot: center`) and prone carpet trip (`pitch: 84`, `pivot: base`)."
    - "180-degree spatial reversal between Shot 2 (`+Z`), Shot 4 (`+X/-Z`), and Master Shot 5 (`-Z`) unified along the `+X` Starboard wall."
    - "Shot 14 splits seamlessly (`14a` -> `14b`, `continuous: true`) for exact rack-focus timing onto the igniting Coordinate Disc at `61.80s`."

video: "https://www.youtube.com/watch?v=Rg5qBRLZfV0"
aspect_ratio: "16:9"
duration: 82.958
offset: 0.0

optics:
  dof_blur: true
  dof: "medium"

# ==============================================================================
# STAGE GEOMETRY & BASELINE CAMERAS
# ==============================================================================
stage:
  width: 14
  depth: 28
  grid_step: 1
  show_rigs: false
  observer_camera:
    target: [1.5, 1.4, -4.5]
    distance: 20.0
    pitch: 26
    yaw: 68
    lens: 32mm
  stage_camera:
    target: [0.0, 1.85, -4.5]
    distance: 6.8
    pitch: -12
    yaw: 135
    lens: 24mm

