# ==============================================================================
# DECOUPLED KINEMATIC BLOCKING TIMELINE (SOLVED CONTINUOUSLY ACROSS CUTS)
# ==============================================================================
blocking:
  # --- T = 0.000s INITIAL VISIBILITY SETUP (EXTERIOR SHELLS ON; LATE PROPS HIDDEN) ---
  - id: "init-hidden-props"
    start: 0.0
    end: 0.05
    entities:
      coord_disc: { visible: false }
      crystal_debris: { visible: false }
      broken_track: { visible: false }
      void_anomaly: { visible: false }
      third_passenger_mark: { visible: false }
      mark_disc_drop: { visible: false }

  - id: "cut-to-interior-shells"
    start: 7.125
    end: 7.20
    entities:
      locomotive: { visible: false }
      coach_fwd_ext: { visible: false }
      coach_lounge_ext: { visible: false }
      coach_rear_ext: { visible: false }

  # --- ACT I: ARRIVAL, UPSIDE-DOWN CHAIR FLOP & TEA POUR (7.125s - 30.800s) ---
  - id: "ruby-straighten"
    entity: "ruby"
    start: 7.125
    end: 8.80
    position: [0.10, 0.0, 2.60]
    rotation: 180
    pitch: 0
    pivot: "base"
    easing: "smooth"
    note: "Straightens up from exhaustion and wipes forehead"

  - id: "ruby-walk-to-chair"
    entity: "ruby"
    start: 8.80
    end: 10.40
    position: [0.80, 0.0, 2.25]
    rotation: 90
    easing: "cruise"
    note: "Crosses to starboard green velvet armchair"

  - id: "ruby-flop-upside-down"
    entity: "ruby"
    start: 10.40
    end: 11.75
    position: [1.00, 0.0, 2.25]
    rotation: 90
    pitch: -130
    pivot: "center"
    height: 1.50
    easing: "pop"
    note: "Flops inverted into green armchair: boots high on window backrest, head hanging toward aisle"

  - id: "arthur-stand-and-groan"
    entity: "arthur"
    start: 9.60
    end: 10.85
    position: [0.68, 0.0, 3.65]
    height: 1.84
    rotation: -115
    easing: "smooth"
    note: "Rises off starboard sofa clutching aching lower back"

  - id: "arthur-sit-by-table"
    entity: "arthur"
    start: 10.85
    end: 12.30
    position: [0.92, 0.0, 4.20]
    height: 1.36
    rotation: -95
    easing: "smooth"
    note: "Lowers heavily onto starboard sofa beside tea table"

  - id: "oscar-turn-and-cross"
    start: 15.50
    end: 20.958
    easing: "cruise"
    entities:
      oscar:
        position: [0.68, 0.0, 3.20]
        rotation: -145
        note: "Crosses aisle during Ruby's POV to stand beside tea table"
      oscar_cane:
        position: [0.76, 0.0, 3.05]

  - id: "oscar-sit-and-pour-tea"
    start: 20.958
    end: 23.10
    easing: "smooth"
    entities:
      oscar:
        position: [0.92, 0.0, 3.30]
        height: 1.34
        look_at: "tea_table"
        note: "Sits beside Arthur on starboard sofa and pours brass teapot"
      oscar_cane:
        position: [0.82, 0.0, 2.95]

  - id: "oscar-sip-tea"
    entity: "oscar"
    start: 23.10
    end: 30.80
    position: [0.92, 0.0, 3.30]
    height: 1.34
    look_at: "arthur"
    note: "Converses calmly with Arthur while sipping tea"

  # --- ACT II: INERTIAL IMPACT JOLT & DEBRIS DISCOVERY (30.800s - 41.417s) ---
  - id: "collision-inertial-jolt"
    start: 30.80
    end: 31.95
    easing: "ease-out"
    entities:
      brass_teapot:
        position: [-0.18, 0.0, 3.35]
        roll: 85
        pivot: "center"
        note: "Sudden negative train acceleration flings teapot off table onto carpet"
      teacup:
        position: [-0.08, 0.0, 2.75]
        pitch: 90
        pivot: "center"
        note: "Teacup shatters forward/left into center aisle"
      arthur:
        position: [0.78, 0.0, 4.10]
        pitch: 24
        pivot: "base"
        note: "Lurches forward over table under inertial jolt"
      oscar:
        position: [0.76, 0.0, 3.25]
        pitch: 22
        pivot: "base"
      ruby:
        pitch: -85
        roll: 20
        pivot: "center"
        note: "Thrown sideways out of inverted chair posture"

  - id: "ruby-tumble-to-window"
    entity: "ruby"
    start: 32.208
    end: 33.45
    position: [1.10, 0.0, 2.25]
    rotation: 90
    pitch: 10
    roll: 0
    pivot: "base"
    height: 1.48
    easing: "ease-out"
    note: "Scrambles upright and presses hand against starboard window glass"

  - id: "debris-reveal-and-drift"
    start: 33.40
    end: 37.20
    easing: "linear"
    entities:
      crystal_debris:
        cut: true
        visible: true
        from: [4.6, 1.45, 1.70]
        position: [4.6, 1.45, 2.35]
        pitch: 12
        roll: -16
        pivot: "center"
        note: "Residual relative drift of shattered crystal outside window"
      broken_track:
        cut: true
        visible: true
        from: [4.35, 1.15, 0.90]
        position: [4.35, 1.15, 1.50]
        roll: 28
        pivot: "center"

  - id: "debris-hide-after-window"
    start: 37.25
    end: 37.35
    entities:
      crystal_debris: { visible: false }
      broken_track: { visible: false }

  - id: "oscar-walk-to-rear-aisle"
    start: 32.208
    end: 37.042
    easing: "cruise"
    entities:
      oscar:
        position: [0.0, 0.0, 4.20]
        height: 1.76
        pitch: 0
        rotation: 0
        note: "Rises and advances down aisle toward rear (+Z) to inspect impact"
      oscar_cane:
        position: [0.24, 0.0, 4.18]

  - id: "arthur-stumble-to-port-booth"
    entity: "arthur"
    start: 34.042
    end: 39.333
    position: [-0.78, 0.0, 3.10]
    height: 1.42
    pitch: 0
    rotation: 20
    easing: "smooth"
    note: "Recovers offscreen across swaying aisle onto port red sofa"

  - id: "oscar-turn-to-warn"
    entity: "oscar"
    start: 37.90
    end: 39.20
    position: [0.0, 0.0, 4.20]
    rotation: 170
    easing: "smooth"
    note: "Turns back toward Ruby and Arthur: 'Worse. Something hit us.'"

  - id: "void-devours-rear"
    start: 39.333
    end: 41.417
    easing: "linear"
    entities:
      void_anomaly:
        cut: true
        visible: true
        from: [0.0, 0.0, 8.8]
        position: [0.0, 0.0, 6.7]
        note: "Pitch-black erasure void advances forward consuming rear of Lounge Car"
      booth_starboard_rear:
        visible: false
      sofa_port_rear:
        visible: false
      ruby:
        position: [-0.10, 0.0, 3.15]
        height: 1.58
        pitch: 0
        rotation: 0
        note: "Steps from window into center aisle staring back at advancing void"
      oscar:
        position: [0.60, 0.0, 3.60]
        rotation: 0
      oscar_cane:
        position: [0.80, 0.0, 3.60]

  # --- ACT III: THREE-SHOT STANDOFF, SPRINT, TRIP & SACRIFICE (41.417s - 56.000s) ---
  - id: "trio-reposition-facing-void"
    start: 41.417
    end: 43.30
    easing: "smooth"
    entities:
      arthur:
        position: [-0.65, 0.0, 3.40]
        height: 1.86
        rotation: 0
        note: "Pushes upright on port (-X) side facing encroaching void"
      oscar:
        position: [0.0, 0.0, 3.55]
        rotation: 0
        note: "Steps dead center confronting erasure anomaly"
      oscar_cane:
        position: [0.22, 0.0, 3.55]
      ruby:
        position: [0.60, 0.0, 3.25]
        rotation: 0
        note: "Darts behind Oscar to starboard (+X) flank"
      void_anomaly:
        position: [0.0, 0.0, 5.8]

  - id: "trio-pivot-and-bolt"
    start: 45.40
    end: 47.083
    easing: "accel"
    entities:
      oscar:
        position: [-0.28, 0.0, 3.00]
        rotation: 180
        note: "Pivots 180 deg toward Forward Car (-Z) and launches sprint"
      oscar_cane:
        position: [-0.45, 0.0, 3.00]
      ruby:
        position: [0.38, 0.0, 2.85]
        rotation: 180
      arthur:
        position: [-0.08, 0.0, 3.75]
        rotation: 180
        note: "Shouts 'Run! Move to the forward car!' trailing behind"
      void_anomaly:
        position: [0.0, 0.0, 5.0]

  - id: "aisle-sprint-and-trip"
    start: 47.083
    end: 48.65
    easing: "linear"
    entities:
      ruby:
        position: [0.22, 0.0, 1.55]
        rotation: 180
      oscar:
        position: [-0.38, 0.0, 1.45]
        rotation: 180
      oscar_cane:
        position: [-0.55, 0.0, 1.45]
      arthur:
        position: [0.10, 0.0, 2.00]
        rotation: 180
      void_anomaly:
        position: [0.0, 0.0, 3.8]

  - id: "ruby-falls-prone"
    start: 48.65
    end: 49.55
    easing: "ease-out"
    entities:
      ruby:
        position: [0.05, 0.0, 1.35]
        rotation: 180
        pitch: 84
        pivot: "base"
        height: 1.50
        note: "Trips and slams face-first onto red aisle carpet"
      oscar:
        position: [-0.45, 0.0, 1.45]
        height: 1.15
        pitch: 28
        look_at: "ruby"
