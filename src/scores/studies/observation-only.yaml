# ==============================================================================
# DECOUPLED BLOCKING TIMELINE (POSTURES, PROP SHIFTS & JOHN'S WALKOUT)
# ==============================================================================
blocking:
  # Shot 3: Robert drops fork and slumps back against vinyl backrest
  - id: "blk-robert-slump"
    entity: "robert"
    start: 8.800
    end: 10.600
    position: [0.88, 0, -0.35]
    rotation: -90
    pitch: -8
    height: 1.32
    easing: "smooth"
    note: "Drops fork, leans back sighing"

  # Shot 4: Sarah leans forward to slide the napkin dispenser across table
  - id: "blk-sarah-napkin-reach"
    start: 14.500
    end: 15.700
    easing: "smooth"
    entities:
      sarah:
        position: [-0.72, 0, -0.22]
        rotation: 90
        pitch: 6
      napkin_dispenser_front:
        position: [0.06, 0.76, -0.16]
        rotation: 0

  - id: "blk-sarah-settle-1"
    entity: "sarah"
    start: 15.700
    end: 16.600
    position: [-0.80, 0, -0.22]
    rotation: 90
    pitch: 0
    easing: "smooth"

  # Shot 6: Robert leans forward countering Sarah
  - id: "blk-robert-counter"
    entity: "robert"
    start: 18.667
    end: 19.800
    position: [0.74, 0, -0.35]
    rotation: -90
    pitch: 8
    height: 1.36
    easing: "smooth"

  # Shot 7: Robert leans back resting chin on hand
  - id: "blk-robert-chin"
    entity: "robert"
    start: 21.500
    end: 22.400
    position: [0.84, 0, -0.35]
    rotation: -90
    pitch: -4
    height: 1.34
    easing: "smooth"

  # Shot 10: Robert leans sharply across table toward John
  - id: "blk-robert-press-john"
    entity: "robert"
    start: 27.167
    end: 28.400
    position: [0.68, 0, -0.46]
    pitch: 14
    look_at: "john"
    easing: "smooth"

  # Shot 12: Sarah turns gently toward John by the window
  - id: "blk-sarah-turn-john"
    entity: "sarah"
    start: 32.800
    end: 34.000
    rotation: 145
    pitch: 4
    easing: "smooth"

  # Shot 13: Robert presses diagnosis; Sarah snaps gaze back to Robert
  - id: "blk-beat-diagnosis"
    start: 37.458
    end: 39.200
    easing: "smooth"
    entities:
      robert:
        position: [0.66, 0, -0.44]
        pitch: 12
        look_at: "john"
      sarah:
        rotation: 90
        pitch: 0

  # Shot 14: Sarah leans in sharply defending John
  - id: "blk-sarah-snap"
    entity: "sarah"
    start: 47.000
    end: 48.200
    position: [-0.75, 0, -0.22]
    rotation: 90
    pitch: 6
    easing: "ease-out"

  # Shot 15: Robert slams table shouting at Sarah
  - id: "blk-robert-slam"
    entity: "robert"
    start: 48.917
    end: 49.600
    position: [0.68, 0, -0.35]
    rotation: -90
    pitch: 10
    easing: "pop"

  # Shot 16: Robert sits tall gesturing with open palms
  - id: "blk-robert-observe"
    entity: "robert"
    start: 49.875
    end: 51.500
    position: [0.76, 0, -0.35]
    rotation: -90
    pitch: 4
    height: 1.38
    easing: "smooth"

  # Shot 17: John bolts out of booth past Sarah's knees
  - id: "blk-john-breakout"
    start: 53.208
    end: 54.083
    easing: "ease-out"
    entities:
      john:
        position: [-0.35, 0, 0.35]
        height: 1.38
        pitch: 8
        rotation: 20
        note: "Slides out of booth past Sarah"
      sarah:
        position: [-0.88, 0, -0.22]
        rotation: 55
        pitch: -6

  # Shot 18a: John rises to full standing height in center aisle and faces booth
  - id: "blk-john-stand"
    start: 54.083
    end: 54.900
    easing: "smooth"
    entities:
      john:
        position: [-0.15, 0, 1.35]
        height: 1.78
        pitch: 0
        look_at: ["robert", "sarah"]
        note: "Stands at aisle mark: 'I'm waiting in the car.'"
      robert:
        position: [0.80, 0, -0.35]
        pitch: 0
        height: 1.36
        look_at: "john"
      sarah:
        position: [-0.80, 0, -0.22]
        pitch: 0
        look_at: "john"

  # Shot 18b: John turns and walks down the center aisle to the exit doors
  - id: "blk-john-walkout"
    start: 56.000
    end: 58.100
    easing: "cruise"
    entities:
      john:
        position: [0.0, 0, 5.15]
        rotation: 0
        note: "Walks down center aisle toward exit"
      robert:
        look_at: "john"
      sarah:
        look_at: "john"

  # Shot 18c: Double glass exit doors push outward as John steps into the rain
  - id: "blk-exit-doors"
    start: 58.100
    end: 59.000
    easing: "ease-out"
    entities:
      exit_door_left:
        position: [0.82, 0, 5.56]
        rotation: -68
      exit_door_right:
        position: [-0.82, 0, 5.56]
        rotation: 68
      john:
        position: [0.0, 0, 6.20]
        rotation: 0
      robert:
        look_at: "john"
      sarah:
        look_at: "john"

# ==============================================================================
# DECOUPLED OBSERVER TIMELINE (DIORAMA PRESENTATION)
# ==============================================================================
observer_shots:
  - id: "obs-01-orbit-in"
    label: "Booth & Rigs Inward Orbit"
    start: 0.000
    end: 48.917
    target: [0.0, 0.95, 0.85]
    maneuver: "orbit"
    direction: "ccw"
    easing: "smooth"
    distance_start: 12
    distance_end: 6.5
    pitch_start: 30
    pitch_end: 23
    yaw_start: -52
    yaw_end: 48
    lens: 30mm

  - id: "obs-02-pullback-exit"
    label: "Aisle & Walkout Pullback"
    continuous: true
    end: 61.500
    from: [0.0, 0.95, 0.85]
    target: [0.0, 1.05, 1.85]
    maneuver: "orbit"
    direction: "ccw"
    easing: "smooth"
    distance: 13
    pitch: 29
    yaw: 68
    lens: 30mm

# ==============================================================================
# FILM COVERAGE SHOTS (18 EXACT CSV CUTS)
# ==============================================================================
shots:
  - id: "shot-01"
    shot: 1
    label: "OTS Robert: Pie Crust"
    description: "50mm OTS past Sarah on Robert sawing at tough diner pie crust."
    start: 0.000
    end: 6.417
    stage_camera:
      maneuver: "cut"
      show_path: false
      rig: { type: "tripod", position: [-1.95, 1.26, 0.92] }
      target: [0.51, 1.06, -0.50]
      lens: 50mm
      focus: "robert"
      dof: "shallow"
      aperture: "f/2.8"
    entities:
      robert: { highlighted: true, note: "Saws at pie crust" }

  - id: "shot-02"
    shot: 2
    label: "OTS Sarah & John"
    description: "50mm reverse OTS past Robert; Sarah stares stoically while John stays slumped."
    start: 6.417
    end: 8.167
    stage_camera:
      maneuver: "cut"
      show_path: false
      rig: { type: "tripod", position: [1.86, 1.24, 0.76] }
      target: [-0.65, 1.04, -0.57]
      lens: 50mm
      focus: ["sarah", "john"]
      dof: "shallow"
      aperture: "f/2.8"
    entities:
      sarah: { highlighted: true }
      john: { highlighted: true }

  - id: "shot-03"
    shot: 3
    label: "OTS Robert: Slump & Sigh"
    description: "Robert drops his fork, slumps back rubbing his eyes, and taps beside his plate."
    start: 8.167
    end: 14.333
    stage_camera:
      maneuver: "cut"
      show_path: false
      rig: { type: "tripod", position: [-1.95, 1.26, 0.92] }
      target: [0.51, 1.06, -0.50]
      lens: 50mm
      focus: "robert"
      dof: "shallow"
      aperture: "f/2.8"
    entities:
      robert: { highlighted: true, note: "Complains about OR shift and pie" }

  - id: "shot-04"
    shot: 4
    label: "OTS Sarah: Napkin Slide"
    description: "45mm reverse OTS; Sarah slides napkin dispenser forward telling Robert to lower his voice."
    start: 14.333
    end: 16.625
    stage_camera:
      maneuver: "cut"
      show_path: false
      rig: { type: "tripod", position: [1.80, 1.25, 0.92] }
      target: [-0.65, 1.02, -0.56]
      lens: 45mm
      focus: "sarah"
      dof: "shallow"
      aperture: "f/2.8"
    entities:
      sarah: { highlighted: true, note: "'Lower your voice, Robert.'" }

  - id: "shot-05"
    shot: 5
    label: "MCU John: Window Isolation"
    description: "85mm MCU past Sarah's foreground arm onto silent John by the rainy glass."
    start: 16.625
    end: 18.667
    stage_camera:
      maneuver: "cut"
      show_path: false
      rig: { type: "tripod", position: [0.83, 1.14, 1.01] }
      target: [-0.68, 0.97, -0.92]
      lens: 85mm
      focus: "john"
      dof: "shallow"
      aperture: "f/2.2"
    entities:
      john: { highlighted: true, note: "'He's exhausted.'" }

  - id: "shot-06"
    shot: 6
    label: "Profile Master: Baseline"
    description: "50mm aisle side-profile wide framing the full family booth against the rainy window."
    start: 18.667
    end: 21.500
    stage_camera:
      maneuver: "cut"
      show_path: false
      rig: { type: "tripod", position: [0.0, 1.14, 2.90] }
      target: [0.0, 1.02, -0.55]
      lens: 50mm
      focus: [0.0, 1.02, -0.55]
      dof: "medium"
      aperture: "f/5.6"
    entities:
      robert: { highlighted: true, note: "'We're all exhausted, Sarah.'" }

  - id: "shot-07"
    shot: 7
    label: "OTS Robert: Chin Rest"
    description: "Robert leans back, hand on chin: 'That's the baseline.'"
    start: 21.500
    end: 22.917
    stage_camera:
      maneuver: "cut"
      show_path: false
      rig: { type: "tripod", position: [-1.95, 1.26, 0.92] }
      target: [0.51, 1.06, -0.50]
      lens: 50mm
      focus: "robert"
      dof: "shallow"
      aperture: "f/2.8"
    entities:
      robert: { highlighted: true }

  - id: "shot-08"
    shot: 8
    label: "OTS Sarah & John: Tapping"
    description: "Reverse OTS as Robert taps the tabletop calling out to John."
    start: 22.917
    end: 24.500
    stage_camera:
      maneuver: "cut"
      show_path: false
      rig: { type: "tripod", position: [1.86, 1.24, 0.76] }
      target: [-0.65, 1.04, -0.57]
      lens: 50mm
      focus: ["sarah", "john"]
      dof: "shallow"
      aperture: "f/2.8"
    entities:
      john: { highlighted: true }

  - id: "shot-09"
    shot: 9
    label: "MCU John: Untouched Toast"
