    start: 24.500
    end: 27.167
    stage_camera:
      maneuver: "cut"
      show_path: false
      rig: { type: "tripod", position: [0.64, 1.12, 0.98] }
      target: [-0.68, 0.97, -0.92]
      lens: 85mm
      focus: "john"
      dof: "shallow"
      aperture: "f/2.2"
    entities:
      john: { highlighted: true }

  - id: "shot-10"
    shot: 10
    label: "Profile Master: Lean In"
    description: "50mm side profile; Robert leans sharply across the table demanding answers."
    start: 27.167
    end: 29.583
    stage_camera:
      maneuver: "cut"
      show_path: false
      rig: { type: "tripod", position: [0.0, 1.14, 2.90] }
      target: [0.0, 1.02, -0.55]
      lens: 50mm
      focus: [0.0, 1.02, -0.55]
      dof: "medium"
      aperture: "f/5.6"
    entities:
