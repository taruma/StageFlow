version: "1.0"
id: "observation-only"
title: "Observation Only"
subtitle: "Late-Night Diner Booth Confrontation"
description: "18-shot diner booth confrontation between Robert, Sarah, and John, culminating in John's aisle walkout."
video: "https://www.youtube.com/watch?v=eR9TBCTyRvw"
aspect_ratio: "16:9"
duration: 68.0
offset: 0.0

optics:
  dof_blur: true
  dof: "shallow"
  aperture: "f/2.8"

metadata:
  director: "Taruma Sakti"
  location: "Late-Night Roadside Diner (Window Booth & Center Aisle)"
  lens_package:
    ots: "45mm–55mm Prime (f/2.8)"
    profile_master: "50mm Prime (f/5.6)"
    closeups: "85mm–110mm Prime (f/2.0–f/2.2)"
    reverse_exit: "35mm Prime (f/2.8)"

stage:
  width: 12
  depth: 14
  grid_step: 1
  show_rigs: true
  observer_camera:
    target: [0.0, 0.95, 0.85]
    distance: 8.8
    pitch: 30
    yaw: -52
    lens: 30mm
  stage_camera:
    target: [0.51, 1.06, -0.50]
    distance: 2.85
    pitch: 4
    yaw: -60
    lens: 50mm

