    shot: 13
    label: "Tighter OTS Robert: Diagnosis"
    description: "55mm tighter OTS past Sarah's bun; Robert cites John's sleeplessness and pupils."
    start: 37.458
    end: 44.917
    stage_camera:
      maneuver: "cut"
      show_path: false
      rig: { type: "tripod", position: [-1.88, 1.28, 0.78] }
      target: [0.46, 1.07, -0.46]
      lens: 55mm
      focus: "robert"
      dof: "shallow"
      aperture: "f/2.8"
    entities:
      robert: { highlighted: true, note: "'Your pupils are pinpricks.'" }

  - id: "shot-14"
    shot: 14
    label: "OTS Sarah: Stop Diagnosing"
    description: "Reverse OTS; Sarah erupts at Robert across the table."
    start: 44.917
    end: 48.917
    stage_camera:
      maneuver: "cut"
      show_path: false
      rig: { type: "tripod", position: [1.86, 1.24, 0.76] }
      target: [-0.65, 1.04, -0.57]
      lens: 50mm
      focus: "sarah"
      dof: "shallow"
      aperture: "f/2.8"
