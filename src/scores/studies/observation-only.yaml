  - id: "shot-12"
    shot: 12
    label: "OTS Sarah: Drink the Water"
    description: "Reverse OTS; Sarah turns to John softly urging three sips of water."
    start: 32.500
    end: 37.458
    stage_camera:
      maneuver: "cut"
      show_path: false
      rig: { type: "tripod", position: [1.86, 1.24, 0.76] }
      target: [-0.65, 1.04, -0.57]
      lens: 50mm
      focus: ["sarah", "john"]
      dof: "shallow"
      aperture: "f/2.8"
