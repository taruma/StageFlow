# ==============================================================================
# DECOUPLED OBSERVER VIEWPORT (SINGLE CONTINUOUS WIDE SPLINE — NO CUTS)
# ==============================================================================
observer_shots:
  - id: "obs-continuous-master"
    label: "Continuous Wide Diorama Sweep (Staging + Cameras)"
    start: 0.000
    end: 68.500
    maneuver: "spline"
    easing: "smooth"
    from: [0.3, 1.1, 2.2]
    target: [0.3, 1.1, 2.2]
    distance_start: 17.5
    pitch_start: 36
    yaw_start: 46
    lens_start: 35mm
    waypoints:
      - { target: [0.4, 1.1, 2.3], distance: 18.0, pitch: 33, yaw: 14, lens: 35mm }
      - { target: [0.2, 1.1, 2.0], distance: 16.8, pitch: 35, yaw: -22, lens: 35mm }
      - { target: [0.1, 1.1, 2.1], distance: 17.5, pitch: 39, yaw: -46, lens: 35mm }
      - { target: [0.3, 1.1, 2.2], distance: 18.5, pitch: 42, yaw: 12, lens: 35mm }

