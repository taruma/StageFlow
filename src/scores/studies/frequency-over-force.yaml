version: "1.0"
id: "frequency-over-force"
title: "Frequency Over Force"
subtitle: "Lecture Hall Debate — 16-Shot Coverage & Metronome Blocking"
description: "Mark and Robert debate synchronization across an elevated lecture stage as a wooden metronome shifts the argument from force to resonance."
video: "https://www.youtube.com/watch?v=9yeuOPMfxPY"
aspect_ratio: "16:9"
duration: 68.5

optics:
  dof_blur: true
  dof: "medium"

metadata:
  director: "Taruma Sakti"
  location: "University Lecture Hall (Elevated Stage)"
  camera_package:
    wide_master: "35mm Prime (Locked Tripod, Audience Floor)"
    coverage: "50mm / 65mm / 85mm / 100mm / 105mm Primes"

# ==============================================================================
# STAGE GEOMETRY & BASELINE CAMERAS
# ==============================================================================
stage:
  width: 14
  depth: 16
  grid_step: 1
  show_rigs: true

  observer_camera:
    target: [0.3, 1.1, 2.2]
    distance: 17.5
    pitch: 36
    yaw: 46
    lens: 35mm

  stage_camera:
    target: [0, 1.65, 0]
    distance: 7.2
    pitch: -6
    yaw: 15
    lens: 35mm

# ==============================================================================
# ENTITIES (ACTORS, ELEVATED STAGE, PROPS & FLOOR MARKS)
# ==============================================================================
entities:
  # --- Characters (standing on Y=0.30m elevated stage) ---
  - id: "mark"
    label: "Mark"
    kind: "character"
    style: "mannequin"
    position: [-2.30, 0.30, -0.05]
    rotation: -90
    size: [0.52, 1.76, 0.44]
    color: "#38bdf8"

  - id: "robert"
    label: "Robert"
    kind: "character"
    style: "mannequin"
    position: [1.95, 0.30, -0.22]
    rotation: -90
    size: [0.58, 1.80, 0.48]
    color: "#f43f5e"

  # --- Architectural Stage & Furniture ---
  - id: "stage_riser"
    label: "Elevated Stage"
    kind: "prop"
    shape: "box"
    style: "solid"
    position: [0, 0, -0.35]
    size: [9.2, 0.30, 3.5]
    color: "#475569"

  - id: "chalkboard"
    label: "Chalkboard Wall"
    kind: "prop"
    shape: "box"
    style: "edges"
    position: [0, 1.35, -2.05]
    size: [8.6, 2.2, 0.12]
    color: "#1e3a3a"

  - id: "desk"
    label: "Lecture Desk"
    kind: "prop"
    shape: "box"
    style: "solid"
    position: [0, 0.30, 0]
    size: [1.85, 0.92, 0.88]
    color: "#78350f"

  # --- Desktop Props (desktop surface Y = 0.30 + 0.92 = 1.22m) ---
  - id: "papers"
    label: "Books & Notes"
    kind: "prop"
    shape: "box"
    style: "solid"
    position: [-0.42, 1.22, -0.08]
    size: [0.48, 0.16, 0.36]
    color: "#e2d5b5"

  - id: "lamp"
    label: "Banker's Lamp"
    kind: "prop"
    shape: "cylinder"
    style: "solid"
    position: [0.38, 1.22, -0.22]
    size: [0.24, 0.38, 0.24]
    color: "#22c55e"

  - id: "metronome"
    label: "Metronome"
    kind: "prop"
    shape: "box"
    style: "solid"
    position: [1.65, 1.48, -0.20]
    rotation: -90
    size: [0.14, 0.28, 0.14]
    color: "#f59e0b"

  # --- Floor Spike Marks (on elevated stage Y=0.30m) ---
  - id: "spike_mark_pace"
    label: "Mark Pace Mark"
    kind: "marker"
    shape: "t"
    style: "tape"
    position: [-2.10, 0.30, -0.05]
    color: "#38bdf8"

  - id: "spike_mark_desk"
    label: "Mark Desk Mark"
    kind: "marker"
    shape: "x"
    style: "tape"
    position: [-1.35, 0.30, -0.05]
    color: "#38bdf8"

  - id: "spike_robert_start"
    label: "Robert Start Mark"
    kind: "marker"
    shape: "t"
    style: "tape"
    position: [1.95, 0.30, -0.22]
    color: "#f43f5e"

  - id: "spike_robert_desk"
    label: "Robert Desk Mark"
    kind: "marker"
    shape: "x"
    style: "tape"
    position: [1.28, 0.30, -0.20]
    color: "#f43f5e"

# ==============================================================================
# DECOUPLED BLOCKING TIMELINE (ACTORS & METRONOME)
