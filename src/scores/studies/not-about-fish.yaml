version: "1.0"
id: "not-about-fish-2026"
title: "Not About Fish"
subtitle: "Gas Station Walk & Car Departure"
description: "Robert and Mark exit a 24-hour store, walk past fuel pumps to a parked sedan, debate a dream over the roof, and drive off."
video: "https://www.youtube.com/watch?v=2s_AZ4RUBNs"
aspect_ratio: "16:9"
duration: 47.589
offset: 0.0

optics:
  dof_blur: true
  dof: "medium"

metadata:
  setting: "24-hour convenience store & Exxon canopy, wet night exterior"
  characters:
    robert: "Grey hair, blue puffer vest, red plaid shirt"
    mark: "Black hair, yellow raincoat, patterned sweater"
  notes:
    - "Unified +Z walk axis from storefront to sedan CXP-3808"
    - "All camera distances include a +1.0m framing buffer"

stage:
