# ==============================================================================
# STAGEFLOW CHOREOGRAPHY SCORE — "THREE YEARS LATE"
# ==============================================================================
version: "1.0"
id: "three-years-late"
title: "Three Years Late"
subtitle: "by Taruma Sakti — Cliffside Spatial Continuity & Solitude Twist"
description: |
  A four-character coastal overlook conversation staged within a single brutalist
  concrete deck bounded by a retaining wall (+X) and a three-segment wooden cliff
  guardrail (-Z / -X). Across 40 locked-off tripod setups, disciplined OTS geometry
  and seated/leaning anchors create the illusion of an intimate group reunion—until
  t=107.208s (Shot 37), when Rosa, Felix, and Samira instantaneously vanish, leaving
  only the postcard on the bench, Evan at the railing, and the film's sole camera
  movement: a slow 85mm dolly-track pull-back into solitude.

metadata:
  director: "Taruma Sakti"
  location: "Coastal Concrete Overlook Deck (Single Stage)"
  camera_grammar:
    shots_01_to_40: "40 locked tripod setups (30mm master, 50–85mm coverage)"
    shot_41_finale: "Sole physical camera move — 85mm linear dolly pull-back"
  wardrobe_color_key:
    evan: "Charcoal denim over white tee (#38bdf8)"
    rosa: "Mustard blazer over black tank (#eab308)"
    felix: "Cream cardigan & wire glasses (#f5e6c8)"
    samira: "Terracotta linen shirt (#e07a5f)"
  directorial_notes:
    - "All camera distances calibrated with +0.5m optical breathing room to avoid tight framing"
    - "Timber post at [-2.55, 0, 0.20] reconciles both Felix-to-Rosa (post left) and Evan-to-Rosa (post center-right) axes"
    - "Twist executed at 107.208s via instantaneous cut visibility removal on Rosa, Felix, and Samira"

video: "https://www.youtube.com/watch?v=b2CDM2VpsP4"
aspect_ratio: "16:9"
duration: 139.167

optics:
  dof_blur: true
  dof: "shallow"
  aperture: "f/2.8"

# ==============================================================================
# STAGE GEOMETRY & BASELINE CAMERAS
# ==============================================================================
stage:
  width: 12
  depth: 12
  grid_step: 1
  show_rigs: true

  observer_camera:
    target: [-0.20, 1.00, 0.20]
    distance: 16.5
    pitch: 36
    yaw: -10
    lens: 35mm

  stage_camera:
    target: [0.10, 0.85, -0.30]
    distance: 7.2
    pitch: 29
    yaw: 15
    lens: 30mm

