version: "1.0"
id: "entropy-taruma-sakti"
title: "Entropy"
subtitle: "by Taruma Sakti"
description: "Two men debate deterministic chaos across a rain-swept Gothic booth table while milk blooms in iced coffee."
video: "https://www.youtube.com/watch?v=8Cbt1E1JotI"
aspect_ratio: "16:9"
duration: 63.125

metadata:
  director: "Taruma Sakti"
  staging:
    - "180-degree dialogue axis across booth table; Mark (-X), Robert (+X)"
    - "Side walls terminate at z=+0.35m for unobstructed OTS cameras; wireframe window preserves exterior sightlines"
  optics_package: "35mm/45mm/50mm masters, 65mm-72mm OTS coverage, 60mm-85mm tabletop inserts"

optics:
  dof_blur: true
  dof: "shallow"

stage:
  width: 12
  depth: 14
  grid_step: 1
  show_rigs: true
  observer_camera:
    target: "center"
    distance: 14.5
    pitch: 28
    yaw: 35
    roll: 0
    lens: 35mm
  stage_camera:
    target: ["mark", "robert"]
    target_offset: [0, 0.25, 0]
    distance: 5.0
    pitch: 2
    yaw: 0
    lens: 35mm

