observer_shots:
  # Beat 1 (0.000s -> 28.875s): Ramps smoothly from front-right (35°) around Stage Right (+90°)
  # to the rear-right exterior (190°), arriving outside the Gothic window right as Shot 10 cuts outside.
  - id: "obs-01-orbit-to-exterior"
    label: "Continuous 360° Crane Orbit (Part 1: Exterior Arrival)"
    start: 0.000
    end: 28.875
    target: "center"
    maneuver: "orbit"
    direction: "ccw"
    easing: "accel"
    distance_start: 14.5
    distance_end: 15.0
    pitch_start: 28
    pitch_end: 24
    yaw_start: 35
    yaw_end: 190
    lens: 35mm

  # Beat 2 (28.875s -> 48.875s): Continues seamlessly at matched angular velocity (~6.75°/s)
  # past the exterior window (180°) and around the Stage Left flank (270° -> 325°), rising over the booth walls.
  - id: "obs-02-orbit-around-flank"
    label: "Continuous 360° Crane Orbit (Part 2: Stage Left Flank)"
    continuous: true
    end: 48.875
    target: "center"
    maneuver: "orbit"
    direction: "ccw"
    easing: "linear"
    distance: 14.0
    pitch: 29
    yaw: 325
    lens: 35mm

  # Beat 3 (48.875s -> 63.125s): Completes the full revolution (325° -> 42° CCW, +77°)
  # while pulling back to 16.5m and climbing to 34° for a full bird's-eye reveal of Shot 19's exterior rig.
  - id: "obs-03-orbit-crane-finale"
    label: "Continuous 360° Crane Orbit (Part 3: High Pull-Back Finale)"
    continuous: true
    end: 63.125
    target: "center"
    maneuver: "orbit"
    direction: "ccw"
    easing: "deccel"
    distance: 16.5
    pitch: 34
    yaw: 42
    lens: 35mm

