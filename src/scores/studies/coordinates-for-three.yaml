version: "1.0"
id: "coordinates-for-three"
title: "Coordinates for Three"
subtitle: "2-Level Japanese House Spatial Blocking & Cinematography Score"
description: >
  Full 3D two-level spatial reconstruction of "Coordinates for Three" (by Taruma Sakti).
  Opens with a deep-focus tatami living room tableau, breaks into a ground-floor hallway chase
  and wooden staircase ascent to Level 2 (Y = 3.0m), and culminates in a symmetric 3-person
  Resonance Disc activation and zero-gravity golden ascension.

metadata:
  director: "Taruma Sakti"
  structure:
    ground_floor: "Y = 0.0m — Tatami Living Room, West Bamboo Engawa, South Corridor"
    vertical_connector: "X = +5.4m — 3-Flight Wooden Staircase (Y = 0.0m -> 3.0m)"
    upper_floor: "Y = 3.0m — Upstairs Tatami Workshop, Resonance Disc Table & Closet"
  staging_notes:
    - "CSV Scene 6 (19.292s–25.458s) is subdivided into 3 shots (Shots 6–8) to reflect the living room breakout, hallway lead-tracking sprint, and lateral apron-tug profile."
    - "All character kinematics, prone/supine postures, stair ascents, and levitations run on the decoupled root blocking timeline."
    - "Observer camera runs as a single continuous wide architectural crane (11.5m–14.8m) focusing on Level 1 first, elevating smoothly to Level 2, then pulling back for the ascension."

video: "https://www.youtube.com/watch?v=yKp3APsZANM"
aspect_ratio: "16:9"
duration: 69.958
offset: 0.0

optics:
  dof_blur: false
  dof: "medium"

# ==============================================================================
# STAGE GEOMETRY & BASELINE CAMERAS
# ==============================================================================
stage:
  width: 16
  depth: 12
  grid_step: 1
  show_rigs: true

  observer_camera:
    target: [-0.20, 0.75, 0.20]
    distance: 13.2
    pitch: 30
    yaw: 32
    roll: 0
    lens: 35mm

  stage_camera:
    target: [0.20, 0.68, -0.15]
    distance: 3.70
    pitch: -4.8
    yaw: 12
    roll: 0
    lens: 22mm

