    height: 1.72
    easing: "smooth"
    note: "Hovers in luminous spiral rings above the workshop table"

  # --- Resonance Disc Activation & Ascension (Shots 17–19 / CSV Scenes 15–17) ---
  - id: "disc-ignite-levitate"
    entity: "artifact_disc"
    start: 53.083
    end: 54.792
    position: [0.70, 3.98, -0.60]
    rotation: 120
    easing: "ease-out"
    note: "Resonance Disc ignites with white-gold light and levitates off velvet cushion"

  - id: "disc-ascend-spin"
    entity: "artifact_disc"
    start: 54.792
    end: 59.750
    position: [0.70, 4.55, -0.60]
    rotation: 360
    easing: "smooth"
    note: "Rises spinning at the glowing epicenter of the levitating trio"

# ==============================================================================
# DECOUPLED CONTINUOUS DIORAMA OBSERVER CAMERA (L1 -> L2 -> FULL 2-LEVEL HOUSE)
# ==============================================================================
observer_shots:
  - id: "obs-01-first-floor"
    label: "L1 Wide Overview (Living Room & Hallway Chase)"
    start: 0.000
    end: 25.458
    maneuver: "dolly"
    easing: "accel"
    from: [-0.20, 0.75, 0.20]
    target: [1.80, 0.85, 1.40]
    distance_start: 13.2
    distance_end: 13.6
    pitch_start: 30
    pitch_end: 28
    yaw_start: 32
    yaw_end: 18
    lens: 35mm

  - id: "obs-02-ascend-second-floor"
    label: "Continuous Elevation to L2 (Staircase Ascent)"
    continuous: true
    end: 33.500
    maneuver: "dolly"
    easing: "linear"
    from: [1.80, 0.85, 1.40]
    target: [0.85, 3.65, -0.70]
    distance: 11.8
    pitch: 24
    yaw: 10
    lens: 35mm

  - id: "obs-03-second-floor-workshop"
    label: "L2 Workshop Wide Panorama (Resonance Disc Table)"
    continuous: true
    end: 53.083
    maneuver: "dolly"
    easing: "linear"
    from: [0.85, 3.65, -0.70]
    target: [0.70, 3.70, -0.65]
    distance: 11.5
    pitch: 25
    yaw: -18
    lens: 35mm

  - id: "obs-04-ascension-full-house"
    label: "Golden Ascension & Full 2-Level House Pull-Out"
    continuous: true
    end: 69.958
    maneuver: "dolly"
    easing: "deccel"
    from: [0.70, 3.70, -0.65]
    target: [0.70, 3.90, -0.60]
    distance: 14.8
    pitch: 32
    yaw: -34
    lens: 35mm

# ==============================================================================
# FILM COVERAGE SHOTS (STAGE CAMERA — 20 EDITORIAL SHOTS / 18 CSV SCENES)
# ==============================================================================
shots:
  # --- Scene 1 (00:00:00.000 -> 00:00:05.375) ---
  - id: "shot-01-opening-tableau"
    shot: 1
    label: "S01: Opening Deep-Focus Living Room Tableau"
    description: "Floor-level 22mm wide master framing Ruby supine with die on nose (FG right), fan (FG center), Arthur prone at low table (MG left), and Oscar in sunlit bamboo engawa (BG far-left)."
    start: 0.000
    end: 5.375
    stage_camera:
      target: [0.20, 0.68, -0.15]
      maneuver: "cut"
      distance: 3.70
      pitch: -4.8
      yaw: 12
      lens: 22mm
      dof: "deep"
      frustum_color: "#f59e0b"
    entities:
      ruby:
        highlighted: true
        note: "Supine on blue pillow, legs up East wall, balancing die on nose"

  # --- Scene 2 (00:00:05.375 -> 00:00:11.042) ---
  - id: "shot-02-arthur-tabletop-cu"
    shot: 2
    label: "S02: Arthur Tabletop Close-Up"
    description: "Low tabletop 85mm close-up across the foreground teacup onto Arthur resting his chin on the chabudai, glancing right at Ruby."
    start: 5.375
    end: 11.042
    stage_camera:
      target: "arthur.head"
      target_offset: [-0.08, 0.02, 0]
      maneuver: "cut"
      distance: 2.45
      pitch: 2
      yaw: 6
      lens: 85mm
      focus: "arthur.head"
      dof: "shallow"
    entities:
      arthur:
        highlighted: true
        note: "'I'll tell them you passed away doing what you loved: complaining.'"

  # --- Scene 3 (00:00:11.042 -> 00:00:15.875) ---
  - id: "shot-03-oscar-engawa"
    shot: 3
    label: "S03: Oscar on the Bamboo Veranda"
    description: "Warm 50mm medium shot looking West toward Oscar sitting cross-legged in the open engawa doorway against the sunlit bamboo forest."
    start: 11.042
    end: 15.875
    stage_camera:
