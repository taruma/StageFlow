    rotation: 90
    pitch: 18
    height: 1.25
    easing: "smooth"
    note: "Kneels on West side of upstairs workshop table catching breath"

  - id: "arthur-levitate-start"
    entity: "arthur"
    start: 53.300
    end: 54.792
    position: [-0.38, 3.55, -0.45]
    look_at: "artifact_disc"
    pitch: -6
    height: 1.85
    easing: "ease-out"
    note: "Lifts off tatami floor as golden resonance rings erupt"

  - id: "arthur-levitate-rise"
    entity: "arthur"
    start: 54.792
    end: 59.750
    position: [-0.55, 4.85, -0.15]
    look_at: "artifact_disc"
    pitch: -10
    roll: -8
    pivot: "center"
    height: 1.85
    easing: "smooth"
    note: "Ascends weightlessly in concentric golden rings into white-out"

  # --- Ruby Blocking (Level 1 -> Hallway -> Stairs -> Level 2 -> Levitation) ---
