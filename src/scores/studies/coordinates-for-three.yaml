    entity: "ruby"
    start: 19.292
    end: 19.850
    position: [1.55, 0.0, 0.95]
    rotation: 0
    pitch: 0
    height: 1.10
    easing: "ease-out"
    note: "Flips legs off East wall and sits up on blue floor cushion"

  - id: "ruby-stand-bolt"
    entity: "ruby"
    start: 19.850
    end: 20.800
    position: [1.15, 0.0, 2.75]
    height: 1.65
    easing: "accel"
    note: "Springs up yelling 'Dibs on the front seat!' and dashes through South doorway"

  - id: "ruby-hall-sprint-1"
    entity: "ruby"
    start: 20.800
    end: 22.800
    position: [3.40, 0.0, 3.65]
    rotation: 90
    pitch: 8
    easing: "linear"
    note: "Sprints East down hallway South lane as Arthur overtakes on her left"

  - id: "ruby-hall-sprint-2"
