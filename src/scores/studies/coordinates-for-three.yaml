  - id: "ruby-levitate-rise"
    entity: "ruby"
    start: 54.792
    end: 59.750
    position: [1.95, 4.85, -0.15]
    look_at: "artifact_disc"
    pitch: -10
    roll: 8
    pivot: "center"
    height: 1.65
    easing: "smooth"
    note: "Floats upward in luminous spiral rings until white-out"

  # --- Oscar Blocking (Engawa -> Hallway -> Leisurely Stair Ascent -> Level 2 -> Levitation) ---
  - id: "oscar-stand-up"
    entity: "oscar"
    start: 21.500
    end: 22.800
    position: [-2.40, 0.0, -0.35]
