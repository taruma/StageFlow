    end: 38.792
    position: [1.95, 3.00, -2.65]
    rotation: 0
    pitch: 0
    easing: "cruise"
    note: "Strolls West down Level 2 upper hallway to workshop doorway"

  - id: "oscar-enter-workshop"
    entity: "oscar"
    start: 38.792
    end: 41.200
    position: [2.20, 3.00, -1.55]
    look_at: "ruby"
    easing: "smooth"
    note: "Steps into upstairs workshop behind Ruby, hands in pockets ('Does it matter?')"

  - id: "oscar-take-center-table"
    entity: "oscar"
    start: 43.875
    end: 45.708
    position: [0.70, 3.00, -1.62]
    rotation: 0
    pitch: 10
    height: 1.62
    easing: "smooth"
    note: "Walks behind North side of workshop table to complete the trio"

  - id: "oscar-levitate-start"
    entity: "oscar"
    start: 53.300
    end: 54.792
    position: [0.70, 3.55, -1.85]
    look_at: "artifact_disc"
    pitch: -4
    height: 1.72
    easing: "ease-out"
