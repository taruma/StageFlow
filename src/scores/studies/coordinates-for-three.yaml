    position: [1.85, 3.00, -2.50]
    pitch: 0
    height: 1.65
    easing: "cruise"
    note: "Runs West along Level 2 landing into workshop"

  - id: "ruby-l2-kneel"
    entity: "ruby"
    start: 29.800
    end: 32.200
    position: [1.58, 3.00, -0.60]
    rotation: -90
    pitch: 15
    height: 1.15
    easing: "smooth"
    note: "Kneels on East side of upstairs workshop table pointing at Resonance Disc"

  - id: "ruby-turn-to-oscar"
    entity: "ruby"
    start: 39.500
    end: 40.600
    position: [1.58, 3.00, -0.60]
    look_at: "oscar"
    pitch: 10
    height: 1.18
    easing: "smooth"
    note: "Turns toward Oscar entering behind her ('Oscar, how does this one even work?')"

  - id: "ruby-turn-to-disc"
    entity: "ruby"
    start: 44.000
    end: 45.200
    position: [1.58, 3.00, -0.60]
    rotation: -90
    pitch: 18
    height: 1.15
