    easing: "cruise"
    note: "Walks calmly across tatami room and out the South doorway"

  - id: "oscar-hall-stroll"
    entity: "oscar"
    start: 24.800
    end: 27.350
    position: [4.55, 0.0, 3.20]
    rotation: 75
    easing: "cruise"
    note: "Arrives leisurely at the wooden pillar at the foot of the staircase"

  - id: "oscar-pillar-turn"
    entity: "oscar"
    start: 27.350
    end: 28.500
    position: [5.35, 0.20, 2.45]
    rotation: 180
    easing: "smooth"
    note: "Rests hand on wooden pillar and steps onto bottom stair"

  - id: "oscar-stairs-climb"
    entity: "oscar"
    start: 28.500
