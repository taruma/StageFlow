# ==============================================================================
# DECOUPLED PHYSICAL BLOCKING TIMELINE (ALL CHARACTERS & ANIMATED PROPS)
# ==============================================================================
blocking:
  # --- Wooden Die Tumble (Shot 4) ---
  - id: "dice-tumble-floor"
    entity: "dice"
    start: 16.250
    end: 17.300
    position: [0.65, 0.0, 0.90]
    rotation: 135
    pitch: 180
    pivot: "center"
    easing: "ease-out"
    note: "Wooden die tumbles off Ruby's nose onto the sunlit tatami mat"

  # --- Arthur Blocking (Level 1 -> Hallway -> Stairs -> Level 2 -> Levitation) ---
  - id: "arthur-startled-lift"
    entity: "arthur"
    start: 17.625
    end: 19.000
    position: [-1.05, 0.14, -1.88]
    rotation: 10
    pitch: 66
    pivot: "base"
    easing: "ease-out"
    note: "Perks head up slightly off table at Oscar's suggestion"

  - id: "arthur-push-up"
    entity: "arthur"
    start: 19.292
    end: 19.950
    position: [0.05, 0.0, -0.95]
    rotation: 20
    pitch: 28
    height: 1.35
    easing: "ease-out"
    note: "Pushes off low table onto knees and swings around East end of table"

  - id: "arthur-bolt-door"
    entity: "arthur"
    start: 19.950
    end: 21.100
    position: [1.25, 0.0, 2.85]
    pitch: 8
    height: 1.85
    easing: "accel"
    note: "Springs up and charges through South living room doorway after Ruby"

  - id: "arthur-hall-sprint-1"
    entity: "arthur"
    start: 21.100
    end: 22.800
    position: [3.85, 0.0, 3.18]
    rotation: 90
    pitch: 10
    easing: "linear"
    note: "Bursts into corridor North lane and overtakes Ruby ('Hey, it's my house!')"

  - id: "arthur-hall-sprint-2"
    entity: "arthur"
    start: 22.800
    end: 25.458
    position: [5.40, 0.0, 2.55]
    rotation: 145
    pitch: 12
    easing: "cruise"
    note: "Sprints East past doorway and pivots onto the foot of the staircase"

  - id: "arthur-stairs-climb"
    entity: "arthur"
    start: 25.458
    end: 27.100
    position: [5.40, 3.00, -1.55]
    rotation: 180
    pitch: 18
    easing: "linear"
    note: "Races up wooden staircase towing Ruby by his apron ties ('No pulling!')"

  - id: "arthur-l2-hallway"
    entity: "arthur"
    start: 27.100
    end: 29.400
    position: [1.45, 3.00, -2.50]
    pitch: 0
    height: 1.85
    easing: "cruise"
    note: "Crosses Level 2 landing West toward workshop doorway"

  - id: "arthur-l2-kneel"
